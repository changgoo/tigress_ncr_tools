[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tigress-ncr-tools"
version = "0.1.0"
description = "Lightweight readers and command-line tools for TIGRESS-NCR outputs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
movie3d = ["scipy"]

[project.scripts]
archive-tigress-snapshots = "tigress_ncr_tools.archive_snapshots:main"
check-suite = "tigress_ncr_tools.check_suite:main"
plot-suite-hst = "tigress_ncr_tools.plot_suite_hst:main"
plot-suite-projections = "tigress_ncr_tools.plot_suite_projections:main"
slice-story-movie = "tigress_ncr_tools.slice_story_movie:main"
surface-density-stats = "tigress_ncr_tools.surface_density_stats:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
